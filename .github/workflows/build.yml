name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project EldiaVisitor.xcodeproj \
            -scheme EldiaVisitor \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Run unit tests
        run: |
          set -o pipefail
          # ランナーに入っている iPhone シミュレーターを1台選ぶ
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "simulator: $udid"
          xcodebuild \
            -project EldiaVisitor.xcodeproj \
            -scheme EldiaVisitor \
            -destination "id=$udid" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log | grep -E "error:|✘|✔ Test run|Test run with|TEST (SUCCEEDED|FAILED)|Testing failed" || true
          grep -q "TEST SUCCEEDED" test.log
      - name: Check Info.plist
        run: |
          plist=$(find ~/Library/Developer/Xcode/DerivedData -path "*Debug-iphonesimulator/EldiaVisitor.app/Info.plist" | head -1)
          plutil -p "$plist" | grep -A8 NSAppTransportSecurity
          plutil -p "$plist" | grep -E "CFBundleDisplayName|MinimumOSVersion"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            test.log
